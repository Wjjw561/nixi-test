<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>只背这个 · CET-4 英语学习助手</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182033;--muted:#7b8497;--line:#e7eaf1;--blue:#315efb;--green:#159a62;--yellow:#c98c00;--red:#d54a5f;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto;padding:20px 15px 100px}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:28px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}.tag{background:var(--soft);color:var(--blue);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.search{display:flex;gap:9px;margin:18px 0 10px}.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:17px;padding:15px 16px;font-size:17px;outline:none}.search button,.primary{border:0;background:var(--blue);color:#fff;border-radius:17px;padding:0 18px;font-weight:800}.quick{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chip,.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px}.chip{border-radius:999px;white-space:nowrap;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:19px;margin-top:13px}.wordrow{display:flex;justify-content:space-between;gap:12px}.word{font-size:38px;font-weight:900}.phon{color:var(--muted);margin-top:4px}.speak{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);color:var(--blue);font-size:20px}.title{display:flex;align-items:center;gap:8px;font-weight:850;margin:20px 0 7px}.dot{width:10px;height:10px;border-radius:50%}.g{background:var(--green)}.y{background:var(--yellow)}.r{background:var(--red)}.meaning{padding:13px 0;border-top:1px solid var(--line)}.meaning:first-of-type{border-top:0}.meaning b{font-size:17px}.phrase{color:var(--blue);font-weight:800;margin-top:5px}.example{margin-top:8px;line-height:1.55}.zh{color:var(--muted);margin-top:3px;line-height:1.55}.tip{background:var(--soft);border-radius:13px;padding:12px 13px;margin-top:14px;line-height:1.6}.skip{background:#fff3f5;border-radius:13px;padding:12px 13px;line-height:1.65}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.actions button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 5px}.actions button:nth-child(1){color:var(--red)}.actions button:nth-child(2){color:var(--yellow)}.actions button:nth-child(3){color:var(--blue)}.actions button:nth-child(4){color:var(--green)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.small{font-size:12px;color:var(--muted);margin-top:3px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.empty strong{display:block;color:var(--text);font-size:19px;margin-bottom:6px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;padding:10px 3px;color:var(--muted);border-radius:12px}.nav button.active{background:var(--soft);color:var(--blue);font-weight:800}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#161a23;color:#fff;padding:10px 13px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="brand">只背这个</div><div class="sub">CET-4 多义词优先级学习</div></div><div class="tag">网页版</div></div>
<section id="searchPage">
<div class="search"><input id="q" placeholder="输入单词，例如 pitch"><button id="go">查</button></div>
<div class="quick" id="quick"></div>
<div class="stats"><div class="stat"><b id="learned">0</b><span>已学</span></div><div class="stat"><b id="due">0</b><span>今日复习</span></div><div class="stat"><b id="bookn">0</b><span>生词本</span></div><div class="stat"><b id="days">0</b><span>学习天数</span></div></div>
<div id="result"></div>
</section>
<section id="reviewPage" class="hidden"><div class="card"><div class="word" style="font-size:28px">今日复习</div><div id="reviewList"></div></div></section>
<section id="bookPage" class="hidden"><div class="card"><div class="word" style="font-size:28px">生词本</div><div id="bookList"></div></div></section>
<section id="aboutPage" class="hidden"><div class="card"><div class="word" style="font-size:28px">怎么用</div><div class="tip">绿色先背，黄色见到能认出来就行，红色暂时跳过。不会的词点“不会”，系统会更早安排复习。内置词没有时会联网查公开词典并尝试翻译。</div></div></section>
</div>
<div class="nav"><div class="navin"><button class="active" data-page="searchPage">查词</button><button data-page="reviewPage">复习</button><button data-page="bookPage">词本</button><button data-page="aboutPage">说明</button></div></div>
<div class="toast" id="toast"></div>
<script>
const W=[
{w:'pitch',p:'/pɪtʃ/',m:[['投、扔','pitch the ball','The player pitched the ball to me.','球员把球投给了我。'],['球场','football pitch','They are playing on the football pitch.','他们正在足球场上踢球。'],['音高','high pitch','Her voice has a high pitch.','她的声音音调很高。']],r:[['推销；提案','sales pitch','He gave a short sales pitch.','他做了一段简短的推销介绍。'],['搭帐篷','pitch a tent','We pitched a tent near the lake.','我们在湖边搭了帐篷。']],s:['沥青、柏油等材料义','少见的“程度、强度”类义项'],t:'先把 pitch 和“投球 / 球场 / 音高”绑定。'},
{w:'issue',p:'/ˈɪʃuː/',m:[['问题；议题','an important issue','This is an important issue.','这是一个重要的问题。'],['发布；发行','issue a statement','The company issued a statement.','公司发布了一份声明。']],r:[['（杂志的）一期','an issue of a magazine','I bought the latest issue.','我买了最新一期。']],s:['血统、流出等少见义项'],t:'四级里最先记“问题/议题”。'},
{w:'charge',p:'/tʃɑːrdʒ/',m:[['收费；费用','free of charge','The service is free of charge.','这项服务是免费的。'],['给……充电','charge the phone','I need to charge my phone.','我需要给手机充电。'],['负责','be in charge of','She is in charge of the project.','她负责这个项目。']],r:[['指控','charge sb. with','He was charged with theft.','他被指控盗窃。']],s:['冲锋等较少见义项'],t:'至少熟悉“收费、充电、负责”三个场景。'},
{w:'present',p:'/ˈpreznt/; /prɪˈzent/',m:[['目前的；现在的','at present','I am busy at present.','我目前很忙。'],['礼物','birthday present','This is a birthday present for you.','这是给你的生日礼物。'],['展示；提出','present an idea','She presented her idea to the class.','她向全班展示了自己的想法。']],r:[['出席的；在场的','be present','All the students were present.','所有学生都到场了。']],s:['较正式、较少见的细分义项'],t:'词性会影响读音。'},
{w:'figure',p:'/ˈfɪɡjər/',m:[['数字','sales figures','The sales figures are rising.','销售数字正在上升。'],['人物','a famous figure','He is a famous figure in history.','他是历史上的著名人物。'],['认为；估计','I figure that...','I figure that we need more time.','我觉得我们还需要更多时间。']],r:[['图；图表','Figure 1','See Figure 1 for details.','详情见图1。']],s:['身材等语境义项先认识即可'],t:'阅读里 figure 经常不是“身材”。'},
{w:'account',p:'/əˈkaʊnt/',m:[['账户','bank account','I opened a bank account.','我开了一个银行账户。'],['解释；说明','account for','How do you account for this change?','你如何解释这个变化？']],r:[['描述；叙述','an account of','He gave an account of the accident.','他讲述了事故经过。'],['考虑到','take...into account','We must take cost into account.','我们必须把成本考虑进去。']],s:['少见会计细分义项'],t:'account for 和 take into account 很值得记。'},
{w:'cover',p:'/ˈkʌvər/',m:[['覆盖；盖住','cover the table','Snow covered the ground.','雪覆盖了地面。'],['包含；涉及','cover a topic','This course covers basic grammar.','这门课涵盖基础语法。'],['封面','book cover','I like the cover of this book.','我喜欢这本书的封面。']],r:[['支付；足以支付','cover the cost','This money will cover the cost.','这笔钱足以支付费用。']],s:['新闻报道等细分义项后补'],t:'阅读里 cover 经常表示“涉及、包括”。'},
{w:'address',p:'/əˈdres/; /ˈædres/',m:[['地址','email address','Please write down your email address.','请写下你的邮箱地址。'],['处理；应对','address a problem','We must address this problem.','我们必须处理这个问题。']],r:[['演讲；致辞','give an address','The president gave a short address.','校长做了简短致辞。']],s:['称呼等细分义项'],t:'address + problem/issue 往往是“处理”。'},
{w:'apply',p:'/əˈplaɪ/',m:[['申请','apply for','I applied for the job.','我申请了这份工作。'],['应用；使用','apply a method','We can apply this method.','我们可以应用这种方法。'],['适用','apply to','This rule applies to everyone.','这条规则适用于所有人。']],r:[['涂；敷','apply cream','Apply the cream twice a day.','每天涂两次药膏。']],s:[],t:'apply for + 申请对象；apply to + 适用于。'},
{w:'run',p:'/rʌn/',m:[['跑','run fast','He runs every morning.','他每天早上跑步。'],['运行；运转','run a program','The program is running.','这个程序正在运行。'],['经营；管理','run a business','She runs a small business.','她经营一家小公司。']],r:[['持续','run for','The meeting ran for two hours.','会议持续了两个小时。']],s:['大量特殊搭配里的细分义项'],t:'看到 program/business/time，要切换意思。'},
{w:'take',p:'/teɪk/',m:[['拿；带','take the book','Please take this book with you.','请把这本书带上。'],['花费（时间）','It takes...','It takes me an hour to get there.','我到那里要花一个小时。'],['乘坐；参加','take a bus / take an exam','I take the bus to school.','我坐公交去学校。']],r:[['采取','take action','We need to take action now.','我们现在需要采取行动。']],s:['大量短语动词细分义项'],t:'take 最适合按搭配记。'},
{w:'set',p:'/set/',m:[['放置','set the cup','She set the cup on the table.','她把杯子放在桌上。'],['设定；设置','set a goal','Set a clear goal for yourself.','给自己设定一个明确目标。'],['一套；一组','a set of','I bought a set of tools.','我买了一套工具。']],r:[['（太阳）落下','the sun sets','The sun sets in the west.','太阳从西边落下。']],s:['数学集合等专业义项'],t:'先抓“放置 / 设置 / 一套”。'}
];
const M=Object.fromEntries(W.map(x=>[x.w,x]));
let st;try{st=JSON.parse(localStorage.getItem('zbz-live')||'{}')}catch(e){st={}};st.reviews=st.reviews||{};st.book=st.book||{};st.days=st.days||[];
function save(){try{localStorage.setItem('zbz-live',JSON.stringify(st))}catch(e){};stats()}
function day(){return new Date().toLocaleDateString('en-CA')}
function touch(){let d=day();if(!st.days.includes(d))st.days.push(d);save()}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sense(a){return `<div class="meaning"><b>${esc(a[0])}</b>${a[1]?`<div class="phrase">${esc(a[1])}</div>`:''}${a[2]?`<div class="example">${esc(a[2])}</div>`:''}${a[3]?`<div class="zh">${esc(a[3])}</div>`:''}</div>`}
function render(w){let saved=!!st.book[w.w];document.getElementById('result').innerHTML=`<div class="card"><div class="wordrow"><div><div class="word">${esc(w.w)}</div><div class="phon">${esc(w.p)}</div></div><button class="speak" onclick="speak('${esc(w.w)}')">🔊</button></div><div style="margin-top:10px"><button class="secondary" onclick="book('${esc(w.w)}')">${saved?'★ 已收藏':'☆ 加入生词本'}</button></div><div class="title"><span class="dot g"></span>必须记</div>${w.m.map(sense).join('')}${w.r.length?`<div class="title"><span class="dot y"></span>认识即可</div>${w.r.map(sense).join('')}`:''}<div class="title"><span class="dot r"></span>暂时不用背</div><div class="skip">${w.s.length?w.s.map(x=>'• '+esc(x)).join('<br>'):'暂无特别需要跳过的义项'}</div><div class="tip">💡 ${esc(w.t)}</div><div class="actions"><button onclick="grade('${esc(w.w)}',0)">不会</button><button onclick="grade('${esc(w.w)}',1)">有点印象</button><button onclick="grade('${esc(w.w)}',2)">认识</button><button onclick="grade('${esc(w.w)}',3)">完全掌握</button></div></div>`}
function speak(w){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}}
async function lookup(){let q=document.getElementById('q').value.trim().toLowerCase().replace(/[^a-z'-]/g,'');if(!q)return;touch();if(M[q]){render(M[q]);return}document.getElementById('result').innerHTML='<div class="card empty">正在联网查词…</div>';try{let r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));if(!r.ok)throw 0;let j=await r.json(),e=j[0],defs=[];(e.meanings||[]).forEach(m=>(m.definitions||[]).slice(0,2).forEach(d=>defs.push([d.definition,'',d.example||'',''])));defs=defs.slice(0,5);let obj={w:e.word||q,p:e.phonetic||'',m:defs.slice(0,2),r:defs.slice(2,4),s:defs.slice(4).map(x=>x[0]),t:'这个词不在内置四级重点词库里，绿色/黄色仅按公开词典返回顺序做学习优先级估算。'};render(obj)}catch(e){document.getElementById('result').innerHTML=`<div class="card empty"><strong>没查到“${esc(q)}”</strong>检查拼写或网络连接。</div>`}}
function grade(w,g){let now=Date.now(),ds=[0,1,3,7][g];st.reviews[w]={g,last:now,due:now+ds*86400000};save();toast(g===0?'今天还会再见它':ds+' 天后复习');renderLists()}
function book(w){if(st.book[w]){delete st.book[w];toast('已移出生词本')}else{st.book[w]={t:Date.now()};toast('已加入生词本')}save();if(M[w])render(M[w]);renderLists()}
function primary(w){return M[w]?M[w].m[0][0]:''}
function stats(){document.getElementById('learned').textContent=Object.keys(st.reviews).length;document.getElementById('due').textContent=Object.values(st.reviews).filter(x=>x.due<=Date.now()).length;document.getElementById('bookn').textContent=Object.keys(st.book).length;document.getElementById('days').textContent=st.days.length}
function openW(w){show('searchPage');document.getElementById('q').value=w;if(M[w])render(M[w]);else lookup()}
function renderLists(){let due=Object.entries(st.reviews).filter(([w,v])=>v.due<=Date.now());document.getElementById('reviewList').innerHTML=due.length?due.map(([w])=>`<div class="row"><div><b>${esc(w)}</b><div class="small">${esc(primary(w))}</div></div><button class="secondary" onclick="openW('${esc(w)}')">复习</button></div>`).join(''):'<div class="empty"><strong>今天没有到期单词</strong>可以学新词。</div>';let b=Object.keys(st.book);document.getElementById('bookList').innerHTML=b.length?b.map(w=>`<div class="row"><div><b>${esc(w)}</b><div class="small">${esc(primary(w))}</div></div><button class="secondary" onclick="openW('${esc(w)}')">打开</button></div>`).join(''):'<div class="empty"><strong>生词本还是空的</strong>查词后点“加入生词本”。</div>'}
function show(id){['searchPage','reviewPage','bookPage','aboutPage'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id!=='searchPage')renderLists()}
document.getElementById('go').addEventListener('click',lookup);document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));document.getElementById('quick').innerHTML=['pitch','issue','charge','run','take','apply','address','figure'].map(w=>`<button class="chip" onclick="openW('${w}')">${w}</button>`).join('');touch();stats();renderLists();document.getElementById('q').value='pitch';render(M.pitch);
</script>
</body>
</html>
