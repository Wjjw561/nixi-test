<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>只背这个 · 统一版</title><link rel="stylesheet" href="unified.css"></head><body>
<div class="app"><div class="top"><div><div class="brand">只背这个</div><div class="sub">查词 + 180天计划 + 复习，终于住进同一个屋檐下</div></div><div class="tag">统一版</div></div>
<section id="searchPage"><div class="search"><input id="q" placeholder="输入单词，例如 pitch"><button class="primary" id="go">查</button></div><div class="quick" id="quick"></div><div class="stats"><div class="stat"><b id="learned">0</b><span>已学</span></div><div class="stat"><b id="due">0</b><span>今日复习</span></div><div class="stat"><b id="bookn">0</b><span>生词本</span></div><div class="stat"><b id="days">0</b><span>学习天数</span></div></div><div id="result"></div></section>
<section id="planPage" class="hidden"><div class="card"><div class="head"><div><div class="word" style="font-size:28px">180 天计划</div><div id="planMeta" class="small">正在载入词表…</div></div><div class="daybox"><button class="secondary" id="prevDay">‹</button><input id="dayInput" type="number" min="1" max="180" value="1"><button class="secondary" id="nextDay">›</button></div></div><div class="progress"><span id="bar"></span></div><div id="progressText" class="small"></div><div class="tabs"><button id="todayBtn" class="active">今天</button><button data-jump="1">第1天</button><button data-jump="31">第31天</button><button data-jump="91">第91天</button><button data-jump="180">第180天</button></div></div><div class="card"><div class="head"><div><span id="stage" class="badge"></span><div id="daySummary" class="small" style="margin-top:7px"></div></div><button class="secondary" id="allDone">全标已学</button></div><div id="dayWords"></div></div></section>
<section id="reviewPage" class="hidden"><div class="card"><div class="word" style="font-size:28px">今日复习</div><div id="reviewList"></div></div></section>
<section id="bookPage" class="hidden"><div class="card"><div class="word" style="font-size:28px">生词本</div><div id="bookList"></div></div></section>
<section id="aboutPage" class="hidden"><div class="card"><div class="word" style="font-size:28px">现在怎么互通</div><div class="tip">计划里的单词可以直接点开查词卡；查词卡里选择“不会/有印象/认识/掌握”后，会同步标记计划进度并进入复习系统。生词本和复习页也打开同一个单词卡。默认学习美音，同时保留英音按钮。</div></div></section></div>
<div class="nav"><div class="navin"><button class="active" data-page="searchPage">查词</button><button data-page="planPage">计划</button><button data-page="reviewPage">复习</button><button data-page="bookPage">词本</button><button data-page="aboutPage">说明</button></div></div><div class="toast" id="toast"></div><script src="unified.js"></script></body></html>
